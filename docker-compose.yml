services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=emergent
      - POSTGRES_PASSWORD=emergent
      - POSTGRES_DB=emergent
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
